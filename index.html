<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMRS</title>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
        background: #f5f5f5;
        color: #555;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #ddd;
        border-top-color: #4f86f7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Tampilan sementara selama verifikasi token berlangsung -->
    <div class="loader">
      <div class="spinner"></div>
      <p>Memeriksa sesi...</p>
    </div>

    <!-- Muat semua fungsi API terlebih dahulu -->
    <script src="/src/js/daftar-api.js"></script>

    <!-- Jalankan pemeriksaan auth setelah skrip siap -->
    <script>
      checkAuthAndRedirect();
    </script>
  </body>
</html>
