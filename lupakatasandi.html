<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet" />
    <title>Lupa Kata Sandi</title>
</head>
<body class="bg-gradient-to-r from-[#0A8A8E] to-[#004C57] min-h-screen flex">
    <img src="/src/img/rsv.svg" class="h-166 ">

     <div class="w-full px-14 py-14 text-white flex items-center justify-center">

      <div class="w-full max-w-md">

        <!-- TITLE -->
        <div class="text-center mb-10">

          <h1 class="text-3xl font-bold mb-4">Lupa Kata Sandi</h1>
            <!-- 3 GARIS -->
            <div class="flex items-center justify-center gap-2 mb-3">

                <div class="w-40 h-1 rounded-full bg-white/80"></div>

                <div class="w-40 h-1 rounded-full bg-white/20"></div>

                <div class="w-40 h-1 rounded-full bg-white/20"></div>

            </div>

            <p class="text-xs text-white text-left">Langkah 1 dari 3 - Verifikasi Identitas</p>
            
        </div>
        
          
        


        <!-- MAIN -->
        <div class="">

          <h2 class="text-lg font-semibold mb-1">Verifikasi Identitas</h2>

          <p class="text-sm text-white mb-6">Masukkan email yang terdaftar di sistem</p>

          <!-- EMAIL -->
            <div class="flex flex-col mb-12">

                <label class="mb-2 font-medium">Email</label>

                 <input type="email" placeholder="Masukkan email anda" class="bg-white/15 w-full rounded-xl px-5 py-4 outline-none border border-white/10 placeholder:text-white/40 focus:ring-2 focus:ring-[#3BC0A8] ">

            </div>
        </div>
          <!-- BUTTON VERIFIKASI -->
          <button class="w-50 max-w-md mx-auto flex justify-center bg-white/15 hover:bg-[#3BC0A8]  py-4 rounded-xl shadow-lg border border-white/10 ">Verifikasi</button>

      </div>

    </div>

</body>
</html>
